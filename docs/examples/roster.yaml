# CourtVision roster file (fictional teams and players).
#
#   courtvision run   --video game.mp4 --calibration calibration.json --roster docs/examples/roster.yaml
#   courtvision serve --source camera --camera 0 --calibration calibration.json --roster docs/examples/roster.yaml
#
# Quote jersey numbers: "0" and "00" are different numbers, and YAML would read an unquoted 00 as 0
# (CourtVision's loader keeps unquoted values as text anyway). player_id is optional and defaults
# to "<team>-<jersey>", e.g. home-23. position is free text (G / F / C, PG, ...).
# Names stay on this machine: cloud payloads (Claude, Jev) only ever carry per-game tokens (D16).
teams:
  home:
    name: Riverside Herons
    players:
      - {jersey: "0", name: Tamsin Arkwright, position: G}
      - {jersey: "00", name: Ilya Brennock, position: G}
      - {jersey: "3", name: Corin Vale, position: G}
      - {jersey: "11", name: Odessa Penhallow, position: F}
      - {jersey: "14", name: Marek Thistlewood, position: F}
      - {jersey: "21", name: Juno Castellane, position: F}
      - {jersey: "23", name: Bram Holloway, position: F}
      - {jersey: "32", name: Kestrel Amberly, position: C}
      - {jersey: "44", name: Ansel Rookwood, position: C}
  away:
    name: Lakeview Comets
    players:
      - {jersey: "1", name: Wren Calloway, position: G}
      - {jersey: "5", name: Silas Dunmore, position: G}
      - {jersey: "7", name: Lyra Fenwick, position: G}
      - {jersey: "10", name: Hollis Maybury, position: F}
      - {jersey: "12", name: Rowan Ashdown, position: F}
      - {jersey: "15", name: Tobiah Greythorne, position: F}
      - {jersey: "24", name: Isolde Marchbanks, position: F}
      - {jersey: "33", name: Fenn Okonkwo-Hale, position: C}
      - {jersey: "50", name: Dorian Quillfeather, position: C}
