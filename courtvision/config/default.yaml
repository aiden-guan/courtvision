# CourtVision default configuration -- GENERATED from the config dataclasses.
# Do not edit by hand: run `python -m courtvision.config` after changing a default.
# tests/test_integration_core_config.py fails when this file drifts from the code.
#
# Load with courtvision.config.load_config(path, overrides=["section.key=value", ...]).
# Copy only the keys you change into your own file; missing keys keep these defaults.
# Nested sections are partial, dict-valued keys merge key by key, lists replace.
# game.league / game.ruleset / game.rule_overrides drive the court, the rules AND the simulator
# (sim.league / sim.ruleset / sim.rule_overrides are overwritten from game.*).
# Credentials never live here: ANTHROPIC_API_KEY (or an `ant auth login` profile) enables Claude,
# TYPESAFE_API_KEY enables live Jev; without them narration is template-only and Jev falls back.

# game: league, rules and roster
game:
  league: nba  # court geometry: "nba" | "fiba" | "ncaa_m" | "ncaa_w" | "nfhs"
  ruleset: null  # RuleSpec id in config/rules/; None = the league's own rules
  rule_overrides: []  # names in config/rules/overrides/ or YAML paths
  roster_path: null  # JSON/YAML roster for video/camera sources (sim makes its own)
  home_name: null  # team display names (None = roster file / simulator names)
  away_name: null

# source: frame source and pacing
source:
  kind: sim  # "sim" | "video" (file) | "camera" (index or URL)
  sim_mode: truth3d  # sim: "truth3d" (3-D truth) | "mono" (NoiseModel, monocular) | "video" (render + perception) | "broadcast" (...
  path: null  # video file for kind="video"
  camera: '0'  # device index ("0") or stream URL for kind="camera"
  realtime: true  # pace frames at t / speed (run_offline always runs as fast as possible)
  speed: 1.0  # playback speed multiplier for realtime pacing
  start_s: 0.0  # skip source time before this (sim window / video seek)
  duration_s: null  # stop after this many source seconds (None = whole source)
  noise_seed: 1  # NoiseModel seed for sim_mode="mono"
  scoreboard: auto  # sim scoreboard: "auto" = "truth" for truth3d, "operator" for mono / video | "truth" (exact, every frame, so...
  drop_late_s: null  # realtime: drop frames more than this late (None = never drop)
  fps: null  # override the container fps for video files (None = from the file)

