    corner_three_ref_ft: 22.5  # typical corner-3 distance (line at 22 ft [1]); unverified
    defender_bucket_edges_ft: [0.0, 2.0, 4.0, 6.0, 12.0]  # Closest-defender buckets (NBA CloseDefDistRange 0-2/2-4/4-6/6+ ft; strings unverified, §4d). The open-ended...
    defender_bucket_fg3: [0.3, 0.34, 0.365, 0.385]  # 3P% by closest defender, midpoints of the note's ranges .29-.31/.33-.35/.36-.37/.38-.39 (§4d); unverified p...
    reference_fg3: 0.36  # NBA 3P% 2025-26, official/B-Ref headline value (§4a, §4c conflict note); sourced
    defender_scale_two: 1.0  # the 3P-calibrated shift applied to 2s at this scale; unverified
    defender_cap_ft: 12.0  # distances beyond this are treated as this (wide open); unverified
