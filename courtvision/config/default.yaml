decision_model:
  enabled: true
  config:
    pass_speed_fts: 35.0  # average ball speed of a pass (~24 mph); unverified, tune on tracking
    pass_release_s: 0.15  # wind-up before the ball leaves the hands; unverified
    lead_receiver: true  # price the catch where the receiver will be (pos + v * flight time)
    lane_ignore_near_passer_ft: 6.0  # The lane starts this far from the passer, so the on-ball defender (who guards from 3-6 ft and is passed aro...
    lane_ignore_near_receiver_ft: 2.0  # ... and ends this far short of the catch point, so the
    complete_base_logit: 4.2  # logit P(complete) for a short, open pass (~.985); unverified.
    complete_per_10ft_logit: -0.35  # longer passes fail more (40 ft ~ .94 open); unverified
    lane_defender_logit: -3.0  # extra log-odds when a defender sits on the lane; unverified
    lane_defender_scale_ft: 2.0  # e-folding distance of that penalty; unverified
    closeout_speed_fts: 10.0  # receiver's defender closes this fast while the ball travels; unverified
    turnover_value: 0.0  # offense points after a failed pass (possession lost); EPV-lite convention
    receiver_can_reset: true  # A completed pass is worth max(receiver's shot, reset value): the receiver may also hold. Off, every pass is...
    self_match_ft: 1.0  # a teammate this close to a holder found only by the event x/y is
    include_miss_value: true  # add (1 - xFG) x OREB rate x putback PPP so shots compare with "hold"
    oreb_at_rim: 0.387  # distance < 4 ft
    oreb_short_mid: 0.32  # 2s, 4-14 ft
    oreb_long_mid: 0.243  # 2s, >= 14 ft
    oreb_three: 0.273  # corner and above-the-break 3s (both .273 in 2025-26)
    putback_ppp: 1.1  # Synergy "Putbacks" placeholder PPP ~1.08-1.15 (§5); unverified
    league_ppp: {nba: 1.16, fiba: 1.05, ncaa_m: 1.03, ncaa_w: 0.92, nfhs: 0.85}  # Hold / reset: league points per possession. NBA 1.160 (pbpstats 2025-26, §4c); sourced. Other leagues: unve...
    hold_full_s: 12.0  # shot clock >= this: a reset is worth a full possession; unverified
    hold_zero_s: 1.0  # shot clock <= this: a reset is worth nothing; unverified
    hold_uses_game_clock: true  # The reset value also runs down with the game clock when it is shorter than the shot clock (end of period, o...
    good_delta: -0.05  # >= this is "good" (jev_integration_design site 4 "best_option"; proposal)
    poor_delta: -0.2  # < this is "poor" (spec; proposal)

# insights: coach cards
insights:
  max_active: 3  # at most 3 cards visible (narration.md §7.3); proposal
  max_words: 12  # <= 12 words per card (narration.md §7.3; RESEARCH §2.7); proposal
  priorities: {foul_trouble: 90, run: 80, team_fouls: 70, turnovers: 60, shot_quality: 50, decision: 45, oreb: 40, hot_hand: 35, lineup: 30, fatigue: 30, ft_rate: 25, shot_diet: 20}  # Higher = more important. Order from jev_integration_design.md site 6 fallback: foul trouble > run >= 8-0 >...
  default_cooldown_s: 120.0  # Same card type <= 1 per 120 s of game clock (narration.md §7.3/§9.5); proposal. Foul trouble and team fouls...
  cooldown_per_subject: false  # The cooldown is per card TYPE ("same alert type <= 1 per 120 s", narration.md §7.3; "a card type appears at...
  cooldown_s: {foul_trouble: 0.0, team_fouls: 0.0, run: 0.0, shot_quality: 300.0, shot_diet: 300.0, oreb: 300.0, ft_rate: 300.0, lineup: 300.0, fatigue: 300.0}
  active_ttl_s: 600.0  # video seconds a "news" card stays active; tuned
  state_kinds: [foul_trouble, team_fouls]  # active while true
  league_rule_defaults: {nba: {foul_out: 6, n_periods: 4, period_s: 720, halves: false, technicals: false}, fiba: {foul_out: 5, n_periods: 4, period_s: 600, halves: false, technicals: true}, ncaa_m: {foul_out: 5, n_periods: 2, period_s: 1200, halves: true, technicals: false}, ncaa_w: {foul_out: 5, n_periods: 4, period_s: 600, halves: false, technicals: false}, nfhs: {foul_out: 5, n_periods: 4, period_s: 480, halves: false, technicals: true}}  # Rule defaults when no RuleSpec is given (rules note §3; sourced): foul-out, periods, halves. "technicals":...
  hot_hand_window: 4  # Hot hand: makes in the last N FGAs, the latest one made; tuned (descriptive only)
  hot_hand_makes: 3
  run_min_points: 8  # Runs: 8-0 or 10-2, update every +4 (narration.md §9.5 run callout); proposal
  run_alt_points: 10
  run_alt_max_opp: 2
  run_update_step: 4
  run_window_rearm_s: 300.0  # a window run re-arms after this (video s) when the stats lack
  xefg_leagues: [nba]  # RESEARCH §7A.2
  sq_min_shots: 15
  sq_min_gap: 0.1  # also the raw-eFG gap between teams outside xefg_leagues; tuned
  diet_min_shots: 15  # Shot diet: midrange share of FGA; NBA long-mid pts/shot .824 vs rim 1.345 (rules note §4c)
  diet_midrange_share: 0.3  # unverified (NBA long 2s are ~7% of FGA, §4c)
  oreb_min_chances: 10  # tuned
  oreb_pct_high: 0.4  # ~1.5x the NBA rate; unverified
  tov_burst_count: 3  # tuned
  tov_burst_possessions: 5  # tuned
  tov_burst_window_s: 180.0  # fallback without POSSESSION events; tuned
  lineup_min_possessions: 20  # Lineup +/-: hidden below ~20 possessions (narration.md §7.2 [59]); proposal
  lineup_min_abs_net: 5.0  # tuned
  fatigue_bin_s: 60.0  # Fatigue: per-player top speed per time bin (observe_frame); tuned / unverified
  fatigue_min_bins: 6
  fatigue_recent_bins: 3
  fatigue_drop: 0.15  # recent top speed >= 15% below the earlier 75th percentile; unverified
  fatigue_min_baseline_fts: 14.0  # ignore players who never ran (~9.5 mph); tuned
  fatigue_quantile: 95.0  # robust per-bin "top speed" (percentile of samples); tuned
  fatigue_min_coverage_s: 20.0  # a bin counts only with this much tracked time; tuned
  fatigue_max_speed_fts: 32.0  # drop implausible samples (perception clamps at 30 ft/s)
  decision_window: 8  # Decision quality: >= 3 "poor" grades in a player's last 8 graded decisions; tuned
