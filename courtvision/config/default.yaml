decision_model:
  enabled: true
  config:
    pass_speed_fts: 35.0  # average ball speed of a pass (~24 mph); unverified, tune on tracking
    pass_release_s: 0.15  # wind-up before the ball leaves the hands; unverified
    lead_receiver: true  # price the catch where the receiver will be (pos + v * flight time)
    lane_ignore_near_passer_ft: 6.0  # The lane starts this far from the passer, so the on-ball defender (who guards from 3-6 ft and is passed aro...
    lane_ignore_near_receiver_ft: 2.0  # ... and ends this far short of the catch point, so the
    complete_base_logit: 4.2  # logit P(complete) for a short, open pass (~.985); unverified.
    complete_per_10ft_logit: -0.35  # longer passes fail more (40 ft ~ .94 open); unverified
    lane_defender_logit: -3.0  # extra log-odds when a defender sits on the lane; unverified
    lane_defender_scale_ft: 2.0  # e-folding distance of that penalty; unverified
    closeout_speed_fts: 10.0  # receiver's defender closes this fast while the ball travels; unverified
    turnover_value: 0.0  # offense points after a failed pass (possession lost); EPV-lite convention
    receiver_can_reset: true  # A completed pass is worth max(receiver's shot, reset value): the receiver may also hold. Off, every pass is...
    self_match_ft: 1.0  # a teammate this close to a holder found only by the event x/y is
    include_miss_value: true  # add (1 - xFG) x OREB rate x putback PPP so shots compare with "hold"
    oreb_at_rim: 0.387  # distance < 4 ft
    oreb_short_mid: 0.32  # 2s, 4-14 ft
    oreb_long_mid: 0.243  # 2s, >= 14 ft
    oreb_three: 0.273  # corner and above-the-break 3s (both .273 in 2025-26)
    putback_ppp: 1.1  # Synergy "Putbacks" placeholder PPP ~1.08-1.15 (§5); unverified
    league_ppp: {nba: 1.16, fiba: 1.05, ncaa_m: 1.03, ncaa_w: 0.92, nfhs: 0.85}  # Hold / reset: league points per possession. NBA 1.160 (pbpstats 2025-26, §4c); sourced. Other leagues: unve...
    hold_full_s: 12.0  # shot clock >= this: a reset is worth a full possession; unverified
    hold_zero_s: 1.0  # shot clock <= this: a reset is worth nothing; unverified
    hold_uses_game_clock: true  # The reset value also runs down with the game clock when it is shorter than the shot clock (end of period, o...
    good_delta: -0.05  # >= this is "good" (jev_integration_design site 4 "best_option"; proposal)
    poor_delta: -0.2  # < this is "poor" (spec; proposal)

# insights: coach cards
insights:
  max_active: 3  # at most 3 cards visible (narration.md §7.3); proposal
  max_words: 12  # <= 12 words per card (narration.md §7.3; RESEARCH §2.7); proposal
  priorities: {foul_trouble: 90, run: 80, team_fouls: 70, turnovers: 60, shot_quality: 50, decision: 45, oreb: 40, hot_hand: 35, lineup: 30, fatigue: 30, ft_rate: 25, shot_diet: 20}  # Higher = more important. Order from jev_integration_design.md site 6 fallback: foul trouble > run >= 8-0 >...
