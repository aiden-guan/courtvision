# stats: box score / tracking / lineups
stats:
  ft_poss_coef: 0.44  # 0.44, Kubatko et al. 2007 [40]; NBA PBP 0.42-0.43; sourced
  ts_ft_coef: 0.44  # 0.44 in TS% [30][31]; sourced
  pace_min_elapsed_s: 60.0  # no pace before 1 game minute (pure noise); tuned
  paint_zones: [restricted_area, paint]  # CourtSpec.zone names (PITP [30]); sourced
  fast_break_window_s: 7.0  # release within 7 s of the possession start; FIBA allows max 8 s [15]; tuned
  fast_break_causes: [defensive_rebound, steal]  # transition starters (spec); tuned
  pts_off_turnover_causes: [turnover, steal]  # possession after a TO [30]; sourced
  steal_link_s: 1.0  # STEAL and TURNOVER this close describe one play; tuned
  assist_requires_made_shot: true  # an assist on a known missed/pending shot is not credited; sourced [15]
  technical_foul_types: [technical, bench_technical, coach_technical]  # FOUL attrs["type"] values kept out of PF and counted as TF [15]; sourced
  possession_kept_ft_types: [flagrant, disruptive, unsportsmanlike]  # SHOT_ATTEMPT attrs["ft_type"] of trips after which the shooting team keeps the ball (flagrant / disruptive;...
  xpts_include_ft: true  # xPTS includes FT attempts so it compares with PTS; design choice
  include_roster_players: true  # list every roster player (DNP lines are zeros); design choice
  run_window_s: 300.0  # "last N minutes" differential window (game seconds when known); tuned
  max_speed_fts: 30.0  # step speed above this is an identity jump (ARCHITECTURE perception clamp); sourced
  speed_window_s: 0.5  # top speed = displacement over this window / window; tuned
  position_smoothing_tau_s: 0.0  # >0: distance on EMA-smoothed positions (off: perception smooths); tuned
  max_track_gap_s: 0.5  # a player unseen longer than this restarts (no step, no time); tuned
  touch_regain_gap_s: 0.5  # holder flicker shorter than this is the same touch; tuned
  decision_buffer_s: 10.0  # frame ring buffer length (spec ~10 s); tuned
  decision_frame_tol_s: 0.5  # nearest buffered frame must be this close to the event; tuned
  grade_kinds: [pass, shot_attempt]  # ARCHITECTURE DecisionModel.grade; sourced
  ocr_confirm_reads: 2  # identical consecutive OCR reads to confirm a score (D14); sourced
  trusted_scoreboard_sources: [manual, feed, sim]  # confirm at once (ARCHITECTURE); sourced
  clock_stale_s: 3.0  # no clock reading for this long -> fall back to live video dt; tuned
  max_frame_dt_s: 0.5  # cap on one frame's video dt (pauses / dropped frames); tuned
  clock_jump_tol_s: 2.0  # An untrusted (OCR) clock reading that puts elapsed game time this far ahead of the video time since the las...
  lineup_min_possessions: 20  # below this a lineup is small_sample (narration.md §7.2 proposal); unverified
  default_first_half_attack: {home: right, away: left}  # ---- attacking direction before any shot evidence: home attacks this basket in the first half
  period_s_by_league: {nba: 720, fiba: 600, ncaa_m: 1200, ncaa_w: 600, nfhs: 480}  # ---- period lengths when no RuleSpec is given (config/rules/*.yaml; sourced)
  ot_s_by_league: {nba: 300, fiba: 300, ncaa_m: 300, ncaa_w: 300, nfhs: 240}
  n_periods_by_league: {nba: 4, fiba: 4, ncaa_m: 2, ncaa_w: 4, nfhs: 4}

