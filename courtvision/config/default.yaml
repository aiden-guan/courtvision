    pull_up_fg3: 0.335  # pull-up 3P% ~.33-.34 (§4d); unverified placeholder
    catch_shoot_min_ft: 10.0  # Catch/pull splits apply to jumpers from this distance: NBA GeneralRange puts "Less Than 10 ft" in its own c...
    catch_shoot_full_ft: 22.0  # ... and ramp linearly to full strength here (the splits are 3P%). The ramp is gentler than the baseline's d...
    shot_type_logit: {jumper: 0.0, layup: -0.25, dunk: 1.5, tip: -0.5, hook: 0.1}  # Log-odds shift by shot type relative to the generic mix at that distance. No FG%-by-type source exists in t...
    ft_pct: {nba: 0.783, fiba: 0.75, ncaa_m: 0.71, ncaa_w: 0.71, nfhs: 0.62}  # League free-throw percentage. NBA .783 (2025-26, §4a; sourced). NCAA D1 men ~.70-.72 (§4e; unverified). FIB...
    league_logit_offset: {nba: 0.0, fiba: -0.05, ncaa_m: -0.1, ncaa_w: -0.3, nfhs: -0.4}  # Log-odds scaling of every FG prior per league. NBA 0 (the priors are NBA). NCAA men -0.10 ~ 3P% 34% vs NBA...
    min_prob: 0.01  # output clip (spec)
    max_prob: 0.99
    fit_max_iter: 100  # Newton iterations
    fit_tol: 1.0e-08  # stop when the largest coefficient step is below this

