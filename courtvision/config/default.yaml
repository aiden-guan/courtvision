  ft_rate_min_fga: 15  # FT rate FTA / FGA; NBA FTr .264 in 2025-26 (§4a)
  ft_rate_high: 0.4  # ~1.5x the NBA rate; unverified
  team_foul_excluded_types: [technical, coach_technical, bench_technical]  # Fouls that are not team fouls (coach / bench technicals per the FIBA manual, rules note §2a; player technic...

# jev: TypeSafe Jev (live needs TYPESAFE_API_KEY; "stub" for demos)
jev:
  enabled: true
  mode: live  # "live" | "stub" | "replay" | "off"
  model: jev-1.13.0  # pinned text model (D2); answers from any other model are untuned
  image_model: jev-1.14.0  # B6 only
  deadlines_s: {B1: 1.5, B2: 1.0, B3: 1.0, B4: 0.8, B5: 0.7, B6: 5.0}  # hard wall clock per bundle
  max_in_flight: 8  # design §2: one asyncio pool, <= 8 requests in flight
  cache_enabled: false  # §7A.9: off until the 20-identical-requests determinism test passes
  images_enabled: false  # B6 only when enabled; images are "dreamer-ready" (design §3 site 8)
  cache_maxsize: 2048
  cache_ttl_s: 120.0
  breaker_threshold: 3  # consecutive failures that open a bundle's circuit (design §7.2 proposal)
  breaker_cooldown_s: 30.0  # open duration before a trial call (design §7.2 proposal)
  rate_limit_min_open_s: 1.0  # floor for a 429 trip when retry-after is missing/short
  replay_path: null  # recorded JSONL for mode="replay" when no mapping is passed in
  thresholds: {}  # overrides of decoders.Thresholds fields
  fallback_rules: {}  # overrides of decoders.FallbackRules fields

# narration: narrator (mode, Claude model, holds)
narration:
  mode: broadcast  # "broadcast" | "coach" | "accessibility"
  llm_enabled: true
  model: claude-opus-5-5  # RESEARCH §2.6; sourced
  effort: low  # §7A.3; sourced
  max_tokens: 1536  # D13; sourced
  candidate_deadline_s: 12.0  # D6 placeholder until the latency harness measures p95; unverified
  p95_total_s: 12.0  # measured Claude p95 total; placeholder (§7A.3); unverified
  max_words: {play_by_play: 12, color: 35, coach: 12, accessibility: 6, correction: 12}
  cooldown_s: {play_by_play: 0.6, color: 1.0, correction: 0.0, accessibility: 0.0, coach: 0.0}
  min_gap_s: 0.6  # min silence between lines, live ball (narration.md §9.5; human 1.7 s [2]); sourced
  use_jev_validator: true  # D4: LLM lines need a passing B4 verdict; sourced
  pseudonymise: true  # D16: False disables the cloud path (names never leave the device); sourced
  cloud_narration_ok: true  # §7A.7 consent gate (DPA, consent, under-13, region); False = template-only
  tts: avspeech  # "avspeech" | "none" | "say" (dev-only, D5)
  seed: 0  # pseudonym shuffle and template variety
  hold_s: {shot_attempt: 0.0, shot_made: 0.2, shot_missed: 0.3, block: 0.3, rebound: 0.3, steal: 0.5, turnover: 0.5, foul: 0.5}  # Confirmation holds before an outcome call (RESEARCH §4.1 / narration.md §9.3; proposals); unverified
  make_wait_s: 3.0  # wait for confirmation (§7A.5 / narration §11.2: 3.0 s until lag is measured); sourced (proposal)
  make_wait_band: 0.8  # calibrated makes in [0.80, gate) wait; below: silence (RESEARCH §4.1); sourced (proposal)
  colour_lines_per_window: 2  # 1-2 colour lines per dead ball (narration.md §4.2); sourced
  two_line_window_s: 20.0  # shorter stoppages (free throws) get 1 line (narration.md §9.2); sourced (proposal)
  colour_start_delay_s: 1.0  # first colour line 1.0-2.0 s after the stoppage call (§4.2); sourced
  min_colour_window_s: 4.0  # a stoppage >= 4 s opens P3 colour (§4.2); sourced
  default_dead_window_s: 8.0  # window assumed when the dead-ball source gives none; tuned
  colour_events: 6  # recent events put in a dead-ball colour packet (their players' stats come along); tuned
  storylines: []  # state-independent topics (season storylines, program facts)
  storyline_refresh_s: 30.0  # min seconds between storyline candidate requests; tuned
  storyline_cooldown_s: 300.0  # Storyline lines at least this far apart in video time: same colour topic >= 5 min, same fact never within 5...
  coach_max_visible: 3  # at most 3 cards visible (narration.md §7.3); sourced (proposal)
  coach_max_words: 12  # <= 12 words per card (§7.3); sourced (proposal)
  coach_immediate_kinds: [foul_trouble, team_fouls]  # Q+1 alerts post immediately (§7.3)
  coach_event_kinds: [foul, period_end]  # event cards in coach mode; tuned
  staff_team: null  # "home" | "away": the staff the coach channel serves (B3 context)
  ad_ttl_s: 4.0  # AD line TTL (AD p95 <= 2 s target, RESEARCH §7A.8); tuned
  recent_lines: 10  # spoken lines kept for repetition checks (narration.md §3.3); sourced
  poll_s: 0.02  # speaking-loop tick (narration.md §8: 50 Hz director tick); sourced
  stop_grace_s: 1.0  # TTS stop() must end the line within this, else the task is cancelled; tuned
  prosody_from_stakes: {routine: calm, notable: up, high_stakes: big, decisive: big}

# director: speak-now / priority / preemption
director:
  ttl_release_s: 0.8  # release call (narration.md §9.1); unverified
  ttl_p0_s: 3.0  # P0 critical (narration.md §9.1); unverified
  ttl_correction_s: 10.0  # corrections (narration.md §3.6: <= 10 s TTL); unverified
  ttl_p1_s: 2.0  # live calls, after confirmation (narration.md §9.1); unverified
  ttl_p2_s: 3.0  # context lines (spec; narration.md proposes 8 s or until the next P1); unverified
  ttl_p3_default_s: 20.0  # P3 cue without its own TTL: <= 20 s dead-ball window (§9.1); unverified
  min_gap_s: 0.6  # min silence between lines, live ball (narration.md §9.5; human 1.7 s [2]); sourced
  cooldown_s: {play_by_play: 0.6, color: 1.0, correction: 0.0, accessibility: 0.0, coach: 0.0}
  kind_cooldown_s: {score_update: 60.0, run: 60.0}
  hedge_window: 3  # hedged phrasing <= 1 in 3 consecutive utterances (narration.md §3.5); sourced
  max_hedges_in_window: 1
  hedge_cap_channels: [play_by_play, color]  # AD / coach state hedges plainly
  max_queued: {0: 4, 1: 1, 2: 3, 3: 2}  # §9.4 buffer depth
  p1_latest_wins: true  # newer P1 replaces queued P1 of the same group (narration.md §4.2); sourced
  p1_flushes_lower: true  # a P1 offer drops queued P2/P3 (P2 lives "until the next P1", §9.1)
  p0_ignores_gap: true  # P0 skips gap and cooldowns (it cuts in at the next word boundary)
  speaking_timeout_s: 30.0  # forget a current line never reported spoken after this long
  correction_storm_count: 2  # more than this many spoken corrections... (narration.md §3.6); sourced
  correction_storm_window_s: 300.0  # ...within 5 game minutes (same); sourced (proposal)
  gate_boost_step: 0.03  # then raise live gates by +0.03 (same); sourced (proposal)
  hold_boost_step_s: 0.2  # and widen holds by +200 ms (same); sourced (proposal)

# facts: FactPacket gates
facts:
  max_recent_lines: 10  # repetition is checked against the last 10 lines (narration.md §3.3); sourced
  trusted_sources: [sim, manual]  # never hedge-only (ARCHITECTURE events/); sourced
  calibrated_statuses: [platt, isotonic, calibrated, assumed_sim]  # §7A.2; sourced
  apply_confidence_gates: true  # calibrated events must also pass their live gate (RESEARCH.md §4.1)
  gates: {shot_attempt: 0.9, shot_made: 0.95, shot_missed: 0.9, rebound: 0.9, steal: 0.9, turnover: 0.9, block: 0.92, foul: 0.97, assist: 0.9, score_correction: 0.95}  # Live gates on Event.confidence for calibrated, unconfirmed events (RESEARCH.md §4.1 / narration.md §9.3; de...
  three_gate: 0.97  # say "three" only if P(3) >= 0.97 (attrs "p_three" when present; §4.1); unverified
  ocr_min_conf: 0.9  # a frame scoreboard OCR read below this does not confirm the score; unverified
  streak_min: 3  # "third straight make" from 3 consecutive made FGs (design proposal); tuned
  run_min_margin: 8  # run callout at 8-0 or 10-2 (narration.md §9.5); sourced (proposal)
  run_max_opp: 2  # ...with the opponent held to <= 2 in that span (same); sourced (proposal)
  milestones: [10, 20, 30, 40]  # player point milestones (narration.md §9.5); sourced (proposal)
  shooting_line_min_fga: 4  # "{P07} is 4-for-6" derived only from 4 attempts (design proposal); tuned
  top_half_angle_deg: 22.5  # AD zone "top": within this angle of the basket axis; tuned
  period_format: {nba: [4, false], fiba: [4, false], ncaa_m: [2, true], ncaa_w: [4, false], nfhs: [4, false]}  # Period naming when no RuleSpec is given: (n_periods, halves) per league (rules note §3).

# templates: template lines
templates:
  max_words: {release: 4, release3: 4, ft_attempt: 5, made2: 8, made3: 8, layup: 8, dunk: 10, ft_made: 5, ft_miss: 5, miss: 5, block: 10, steal: 8, turnover: 8, oreb: 6, dreb: 4, team_reb: 4, assist: 6, possession: 6, bring_up: 6, foul: 10, whistle: 5, timeout: 10, substitution: 10, period_start: 12, period_end: 12, score_update: 12, run: 12, hedge_shot: 8, hedge_ft: 6, hedge_loose: 6, hedge_stop: 5, hedge_rebound: 4}
  line_cap: {play_by_play: 12, color: 35, coach: 12, accessibility: 6, correction: 12}
  assist_extra_words: 4  # assist add-on may extend a made call by this much (design proposal)
  streak_extra_words: 4  # streak add-on allowance (design proposal)
  score_tail_max_margin: 6  # score tail on makes within two possessions, ties, lead changes; tuned
  ad_names: true  # AD shot calls carry the shooter token (identity tiers apply when rendered)
  lru_window: 3  # none of the last 3 variants of a family repeats (narration.md §3.4); sourced
  repetition_jaccard: 0.8  # never pick a variant the validator would reject as a repeat (spec)

# candidates: Claude candidate pool (None = derived from narration.*)
candidates: null

# tts: voice (engine chosen by narration.tts)
tts:
  words_per_s: 3.5  # macOS default voice measured 3.5-3.7 words/s (narration.md §4.1 [M]); sourced
  min_line_s: 0.4  # shortest simulated line (one-word calls); tuned
  rate_wpm: 210  # `say -r`: Samantha measured ~210-220 wpm (narration.md §4.1 [M]); sourced
  voice: null  # None = system default voice (licensed stock voices only, RESEARCH §2.7)
  prosody_rate: {calm: 0.95, up: 1.05, big: 1.12}  # Prosody multipliers (narration.md §3.4 "calm / up / big"; values are design proposals); unverified
  prosody_pitch: {calm: 1.0, up: 1.05, big: 1.1}
  poll_s: 0.02  # completion polling interval for engines without a completion future; tuned
  start_timeout_s: 1.5  # AVSpeech: give up if speaking never starts (cold start 0.6-1.0 s [M]); sourced
  stop_grace_s: 1.0  # how long stop() may take before speak() is forced to return; tuned

# captions: caption / AD cue timing
captions:
  delay_s: 1.0  # D: overlay 0.8-1.0 s, caption/anti-wagering 30-60 s (RESEARCH §7A.8); sourced range, set per stream
  pts_offset_s: 0.0  # source PTS (seconds) at video t = 0; set from the demuxer; tuned per source
  words_per_s: 3.5  # cue duration from word count (narration.md §4.1 [M]); sourced
  min_cue_s: 1.0  # shortest on-screen cue; tuned
  max_cue_s: 7.0  # longest on-screen cue; tuned
  video_epoch_s: null  # Unix time of video t = 0 (live sources); None = anchor at the first cue

# llm: Claude client (needs Anthropic credentials)
llm:
  cache_ttl: 1h  # prompt-cache TTL: Claude runs rarely (timeouts, breaks), so keep the prefix 1 h
  prewarm: true  # pre-warm the cached system prefix at start and periodically
  prewarm_interval_s: null  # None = auto: 55 min with a 1 h TTL, 4 min with the 5 min default
  answer_directly: false  # C2 system line (RESEARCH §7A.3); keep off until measured
  fallbacks: default  # server-side refusal fallback (opus-class models)
  timeout_s: 30.0  # HTTP timeout; candidate deadlines are enforced by the narrator
  max_retries: 0  # speculative lines are never retried
  offline: false  # allow Claude in non-realtime runs (video time races ahead of wall time)

# server: FastAPI app
server:
  static_dir: ''  # "" -> the package's server/static directory
  protect_reads: true  # with a token, GET /api/* needs it too (rosters of minors, D16 spirit)
  allowed_origins: []  # extra browser origins; same-origin always ok
  allowed_hosts: []  # Extra Host names accepted (exact or "*.suffix"; "*" disables the check). IP literals, single-label names (l...
  max_body_bytes: 65536  # largest accepted request body (calibration/ROI payloads are < 8 KB)
  events_limit_default: 1000  # GET /api/events default page size
  events_limit_max: 20000  # matches HubConfig.event_log_max
  ws_receive_max_bytes: 4096  # client->server WS messages (pings) larger than this are ignored
  max_speed: 16.0  # largest playback speed accepted by POST /api/control
  openapi: true  # serve /openapi.json (the CDN-based /docs UI is never served: offline)
  telemetry: false  # FastAPI native OpenTelemetry (off: footage-adjacent data stays local)

# hub: WebSocket hub
hub:
  queue_size: 256  # Per-client live queue capacity; on overflow the oldest superseded snapshot is dropped, else the oldest mess...
  replay_history: 200  # Events / utterances / insights / captions replayed to a late joiner (ARCHITECTURE "server/" and task spec:...
  max_rate_hz: {frame: 15.0, stats: 4.0}  # Per-client max delivery rate per message type, latest-wins (frame <= 15 Hz: task spec, sourced; stats 4 Hz:...
  latest_types: [meta, status, stats, frame]  # Message types whose latest instance is kept and replayed (snapshot semantics).
  replay_exclude_event_kinds: [dribble]  # Event kinds left out of the WS replay (high-frequency, never narrated; ARCHITECTURE "Shared event semantics...
  event_log_max: 20000  # REST event log cap (latest revision per event id). A full game is a few thousand events including dribbles...
  transcript_max: 5000  # REST transcript cap (utterances), tuned.
  disconnect_on_overflow: true  # Close a client whose queue had to drop a non-superseded message, so the browser reconnects and receives a c...

# serve: host / port / token env var
serve:
  host: 127.0.0.1  # local in-gym server by default
  port: 8765  # dashboard port (`courtvision serve --port`)
  auth_token_env: COURTVISION_TOKEN  # bearer token read from this env var (never from the file)

# pipeline: LiveGame rates and outputs
pipeline:
  frame_hz: 15.0  # frame messages to the hub (video-time rate)
  stats_hz: 1.0  # stats snapshots to the hub
  insights_hz: 1.0  # InsightEngine.update between event batches
  tick_hz: 10.0  # Narrator.tick (dead-ball colour scheduling)
  sim_assume_calibrated: true  # sim sources are simulator evaluations: cue models report "assumed_sim"
  keep_frames: true  # keep perceived frames of offline sim video runs for the tracking report
  max_kept_frames: 36000  # cap on kept frames (20 min at 30 fps)
  tail_s: 15.0  # source-time seconds narration may finish after the last frame
  runs_dir: runs  # run_offline output root when no directory is given
  jpeg_quality: 80  # GET /api/frame.jpg quality
  captions_sidecar: true  # caption / AD cues -> hub "caption" messages
  webvtt_path: null  # also write an HLS WebVTT caption file
  status_hz: 1.0  # status messages (pause / speed / lag) to the hub
  hub_decisions: 40  # newest decision grades per hub stats message, slimmed (stats.json keeps all)

# eval: truth comparison (sim sources)
eval:
  tol_s: 1.0  # event matching tolerance (ARCHITECTURE)
  match_player: true
  track_match_radius_ft: 3.0  # tracking_report match radius
